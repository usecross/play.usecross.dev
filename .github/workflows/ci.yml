name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-progress runs for the same workflow on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup uv (build the pinned upstream runtime wheel)
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # Only install if cache missed to save time
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun test:install

      - name: Typecheck runner and shell
        run: bun run typecheck

      - name: Test real Python renderer without threads or Vite probes
        run: bun run test:python

      - name: Run Playwright tests
        run: bun run test
        env:
          # Increase timeouts for CI environment (slower than local)
          PLAYWRIGHT_TIMEOUT: 60000

      - name: Test production assets with Cloudflare's local runtime
        run: bun run test:production

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
